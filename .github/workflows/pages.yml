# Publishes PicoPods Web (the pods in the browser, tools/build_web.sh) to
# GitHub Pages on every push to main. Opt-in: enable Pages with source
# "GitHub Actions" (Settings > Pages), then set the repository variable
# PICOPODS_PAGES to true (Settings > Secrets and variables > Actions).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PICOPODS_PAGES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pico SDK (mbedTLS sources)
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.1"
          path: pico-sdk
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
      - name: Build
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          CMAKE_GENERATOR: Ninja
        run: tools/build_web.sh dist/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
